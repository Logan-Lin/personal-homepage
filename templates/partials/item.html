<div class="item">
  <div class="item-meta">
    <span>{{ item.tags|join:"<span class='text-secondary'> | </span>"|safe }}</span>
    {% for link in item.links %}
      <a href="{{ link.url }}" target="_blank" rel="noopener noreferrer">{{ link.name }}</a>
    {% endfor %}
  </div>
  <div>{{ item.title|safe }}</div>
  {% if item.authors %}
    <div class="item-author">{{ item.authors|safe }}</div>
  {% endif %}
  {% if item.desc %}
    <div class="item-desc">{{ item.desc|safe }}</div>
  {% endif %}
</div>
