home:
  research:
    - desc: "Trajectory representation learning is one of my established research topics. It aims to learn representations of trajectories (of vehicle, human, or vessel, etc.) that are universal across various downstream tasks. This also extends to building a multi-task/foundational model for trajectories that can perform various tasks at once."
      entries:
        - unite-survey
        - uvtm
        - mmtec
        - ctle
        - transfertraj

    - desc: "Spatiotemporal data mining is a broader topic that is inclusive of the above. It covers research on extracting and utilizing patterns from large-scale data with spatial information and that is dynamic over time (usually sourced from transportation scenarios)."
      entries:
        - disgmm
        - dot
        - ripcn
        - plmtrajrec
        - path-llm

    - desc: "AI for materials science is a new research direction I am exploring. The promise is that data mining-driven AI enables discovery of new materials with tailored properties, a non-trivial process in traditional materials design."
      entries:
        - amden
        - amden-pncs17
        - villum-inverse-design
        - sculptdrug

  teaching:
    - desc: "My course teaching follows three core principles: a solid understanding of the subject matter, awareness of students' established experiences and background, and problem-based learning style applied throughout lectures, exercises, and exams. This translates to practices including tailor-made blog-style literature that is both professional and intuitive, inspirational lectures that connect theory to real-world problems, and progressively-arranged hands-on exercises that build practical problem-solving skills."
      entries:
        - ai-systems
    - desc: "I am building my supervision experience, supervising Bachelor's and Master's semester projects. My supervision focuses on problem definition, critical thinking about design choices, and delivering convincing conclusions."
      entries:
        - assess-data-traj
        - sw6-camera-behind

publications:
  primary:
    desc: "Publications where I am the first, co-first, or lead student author. For each work, I contribute significantly to some or all of the following: problem formulation, algorithm design, paper drafting and revision, code implementation, and experimental evaluation."
    entries:
      - id: amden
        title: "Inverse Design of Amorphous Materials with Targeted Properties"
        authors: "Jonas A. Finkler*, Yan Lin*, Tao Du, Jilin Hu, Morten M. Smedskjaer"
        desc: "Generates atomic structures of disordered materials such as glasses that match desired target properties, and refines them into stable low-energy configurations. Also introduces new datasets of amorphous materials to support this kind of design."
        tags:
          - "Advanced Materials"
          - "2026"
        links:
          Paper: "https://doi.org/10.1002/adma.202522493"
          Preprint: "https://arxiv.org/abs/2509.13916"
          Code: "https://github.com/Logan-Lin/AMDEN-code"

      - id: disgmm
        title: "DiSGMM: A Method for Time-varying Microscopic Weight Completion on Road Networks"
        authors: Yan Lin, Hu Jilin, Shengnan Guo, Christian S. Jensen, Youfang Lin, Huaiyu Wan
        desc: "Fills in missing fine-grained, time-varying traffic conditions on road networks, such as travel speeds on individual road segments during specific time periods, when observations are sparse both across segments and within each segment. Estimates the full range of likely conditions for each segment and time rather than a single value."
        tags:
          - "IJCAI"
          - "2026"
        links:
          Preprint: "https://arxiv.org/abs/2603.29837"
          Code: "https://github.com/Logan-Lin/DiSGMM-code"

      - id: trajar
        title: "TrajAR: Long-Term Trajectory Prediction at Urban Intersections via Multi-scale Interaction Perception"
        authors: Letian Gong*, Yan Lin*, Xinyue Zhang, YiWei Shuang, Guanyu Yao, Cheng Long, Shengnan Guo, Youfang Lin, Huaiyu Wan
        desc: ""
        tags:
          - "IJCAI"
          - "2026"
        links: {}

      - id: ripcn
        title: "RIPCN: A Road Impedance Principal Component Network for Probabilistic Traffic Flow Forecasting"
        authors: Haochen Lv*, Yan Lin*, Shengnan Guo, Xiaowei Mao, Hong Nie, Letian Gong, Youfang Lin, Huaiyu Wan
        desc: "Forecasts future traffic flow across a road network while also estimating how uncertain each prediction is, combining transportation theory with learned models to capture how congestion shifts traffic between connected roads over time."
        tags:
          - "KDD"
          - "2026"
        links:
          Preprint: "https://arxiv.org/abs/2512.21685"

      - id: trajmamba
        title: "TrajMamba: An Efficient and Semantic-rich Vehicle Trajectory Pre-training Model"
        authors: Yichen Liu*, Yan Lin*, Shengnan Guo, Zeyu Zhou, Youfang Lin, Huaiyu Wan
        desc: "Learns rich and compact representations of vehicle GPS trajectories that capture both how vehicles move and why they travel. Removes redundant trajectory points and adds travel purpose information from roads and nearby places, improving accuracy and efficiency across downstream tasks."
        tags:
          - "NeurIPS"
          - "2025"
        links:
          Poster: "https://neurips.cc/virtual/2025/poster/115959"

      - id: transfertraj
        title: "TransferTraj: A Vehicle Trajectory Learning Model for Region and Task Transferability"
        authors: Tonglong Wei*, Yan Lin*, Zeyu Zhou, Haomin Wen, Jilin Hu, Shengnan Guo, Youfang Lin, Gao Cong, Huaiyu Wan
        desc: "Learns from vehicle GPS trajectories in a way that transfers across different geographic regions and different prediction tasks without retraining, removing the need to keep separate specialized models. Handles each task by treating it as recovering hidden parts of a trajectory, so one model serves many tasks even with limited data."
        tags:
          - "NeurIPS"
          - "2025"
        links:
          Oral: "https://neurips.cc/virtual/2025/oral/117509"
          Poster: "https://neurips.cc/virtual/2025/poster/117508"
          Preprint: "https://arxiv.org/abs/2505.12672"

      - id: plmtrajrec
        title: "PLMTrajRec: A Scalable and Generalizable Trajectory Recovery Method with Pre-trained Language Models"
        authors: Tonglong Wei*, Yan Lin*, Youfang Lin, Shengnan Guo, Jilin Hu, Haitao Yuan, Gao Cong, Huaiyu Wan
        desc: "Recovers the missing points in sparse movement trajectories to restore detailed paths, while needing only a small amount of dense training data and generalizing across trajectories recorded at different sampling rates."
        tags:
          - "NeurIPS"
          - "2025"
        links:
          Poster: "https://neurips.cc/virtual/2025/poster/117945"
          Preprint: "https://arxiv.org/abs/2410.14281"

      - id: uvtm
        title: "UVTM: Universal Vehicle Trajectory Modeling with ST Feature Domain Generation"
        authors: "Yan Lin, Jilin Hu, Shengnan Guo, Bin Yang, Christian S. Jensen, Youfang Lin, Huaiyu Wan"
        desc: "A single model for vehicle GPS trajectories that handles many tasks such as travel time estimation, trajectory recovery, and trajectory prediction, instead of maintaining a separate model for each. It stays accurate even when trajectories are sparse or only part of their features are available, by learning to rebuild dense and complete trajectories from incomplete ones."
        tags:
          - "IEEE TKDE"
          - "2025"
        links:
          Paper: "https://ieeexplore.ieee.org/document/11004614"
          Preprint: "https://arxiv.org/abs/2402.07232"
          Code: "https://github.com/Logan-Lin/UVTM"

      - id: trajcogn
        title: "TrajCogn: Leveraging LLMs for Cognizing Movement Patterns and Travel Purposes from Trajectories"
        authors: "Zeyu Zhou*, Yan Lin*, Haomin Wen, Shengnan Guo, Jilin Hu, Youfang Lin, Huaiyu Wan"
        desc: "Adapts large language models to understand movement trajectories so they can recognize how people move and infer the purposes behind their travel. A single model handles a range of trajectory analysis tasks across different settings."
        tags:
          - "IJCAI"
          - "2025"
        links:
          Paper: https://www.ijcai.org/proceedings/2025/411
          Preprint: "https://arxiv.org/abs/2405.12459"
          Code: "https://github.com/Zeru19/PLM4Traj"

      - id: unite-survey
        title: "UniTE: A Survey and Unified Pipeline for Pre-training Spatiotemporal Trajectory Embeddings"
        authors: "Yan Lin, Zeyu Zhou, Yicheng Liu, Haochen Lv, Haomin Wen, Tianyi Li, Yushuai Li, Christian S. Jensen, Shengnan Guo, Youfang Lin, Huaiyu Wan"
        desc: "Surveys existing methods for learning reusable representations of movement trajectories and brings them together into a single modular framework with shared code, so that new methods can be built, compared, and evaluated on the same basis."
        tags:
          - "IEEE TKDE"
          - "2025"
        links:
          Paper: "https://ieeexplore.ieee.org/document/10818577"
          Preprint: "https://arxiv.org/abs/2407.12550"
          Code: "https://github.com/Logan-Lin/UniTE"

      - id: path-llm
        title: "Path-LLM: A Multi-Modal Path Representation Learning by Aligning and Fusing with Large Language Models"
        authors: "Yongfu Wei*, Yan Lin*, Hongfan Gao, Ronghui Xu, Sean Bin Yang, Jilin Hu"
        desc: "Learns representations of paths in a road network by combining the network structure with text that describes physical and regional context, which earlier methods left out. The combined view improves accuracy on tasks such as ranking paths and estimating travel time, including settings with little or no labeled data."
        tags:
          - "WWW"
          - "2025"
        links:
          Paper: "https://openreview.net/forum?id=KmMSQS6tFn"
          Code: "https://github.com/decisionintelligence/Path-LLM"

      - id: dutytte
        title: "DutyTTE: Deciphering Uncertainty in Origin-Destination Travel Time Estimation"
        authors: "Xiaowei Mao*, Yan Lin*, Shengnan Guo, Yubin Chen, Xingyu Xian, Haomin Wen, Qisen Xu, Youfang Lin, Huaiyu Wan"
        desc: "Estimates the travel time between an origin and a destination and measures how uncertain each prediction is, by first inferring the likely route the trip will follow and then producing reliable confidence intervals that reflect how individual road segments contribute to the overall uncertainty under varying conditions."
        tags:
          - "AAAI"
          - "2025"
        links:
          Paper: "https://ojs.aaai.org/index.php/AAAI/article/view/33350"
          Preprint: "https://arxiv.org/abs/2408.12809"

      - id: mobility-llm
        title: "Mobility-LLM: Learning Visiting Intentions and Travel Preference from Human Mobility Data with Large Language Models"
        authors: "Letian Gong*, Yan Lin*, Xinyue Zhang, Yiwen Lu, Xuedi Han, Yichen Liu, Shengnan Guo, Youfang Lin, Huaiyu Wan"
        desc: "Analyzes human mobility data such as sequences of visited locations to learn why people visit places and what travel preferences they have, and uses large language models to support tasks like predicting future locations."
        tags:
          - "NeurIPS"
          - "2024"
        links:
          Paper: "https://openreview.net/forum?id=0feJEykDRx"
          Poster: "https://neurips.cc/virtual/2024/poster/96914"

      - id: dot
        title: "Origin-Destination Travel Time Oracle for Map-based Services"
        authors: "Yan Lin, Huaiyu Wan, Jilin Hu, Shengnan Guo, Bin Yang, Christian S. Jensen, Youfang Lin"
        desc: "Estimates the travel time between an origin and a destination at a given departure time by learning from many past trips that connect the same pair of locations. It first infers a likely route between the two points and then predicts the travel time along it, improving accuracy for map-based navigation services."
        tags:
          - "SIGMOD"
          - "2024"
        links:
          Paper: "https://dl.acm.org/doi/10.1145/3617337"
          Preprint: "https://arxiv.org/abs/2307.03048"
          Code: "https://github.com/Logan-Lin/DOT"

      - id: mmtec
        title: "Pre-training General Trajectory Embeddings with Maximum Multi-view Entropy Coding"
        authors: "Yan Lin, Huaiyu Wan, Shengnan Guo, Jilin Hu, Christian S. Jensen, Youfang Lin"
        desc: "Learns general-purpose representations of movement trajectories from unlabeled data that capture both travel behavior and spatial and temporal patterns. The learned representations avoid task-specific bias so they transfer well across many downstream tasks."
        tags:
          - "IEEE TKDE"
          - "2023"
        links:
          Paper: "https://ieeexplore.ieee.org/abstract/document/10375102"
          Preprint: "https://arxiv.org/abs/2207.14539"
          Code: "https://github.com/Logan-Lin/MMTEC"

      - id: tale
        title: "Pre-training Time-Aware Location Embeddings from Spatial-Temporal Trajectories"
        authors: "Huaiyu Wan, Yan Lin, Shengnan Guo, Youfang Lin"
        desc: "Learns vector representations of locations from spatial-temporal trajectories that capture not only where places are but also when people visit them, since the time of visit reflects what a place is used for. These time-aware representations are pre-trained without labels and improve a range of downstream location-based prediction tasks."
        tags:
          - "IEEE TKDE"
          - "2022"
        links:
          Paper: "https://ieeexplore.ieee.org/abstract/document/9351627"
          Code: "https://github.com/Logan-Lin/TALE"

      - id: ctle
        title: "Pre-training Context and Time Aware Location Embeddings from Spatial-Temporal Trajectories for User Next Location Prediction"
        authors: "Yan Lin, Huaiyu Wan, Shengnan Guo, Youfang Lin"
        desc: "Pre-trains location representations from movement trajectories that capture how the meaning of a place changes with its surrounding context and the time of visit, leading to more accurate prediction of a user's next location."
        tags:
          - "AAAI"
          - "2021"
        links:
          Paper: "https://ojs.aaai.org/index.php/AAAI/article/view/16548"
          Code: "https://github.com/Logan-Lin/CTLE"

  secondary:
    desc: "Publications where I serve as a contributing author. My involvement in these works typically includes technical discussion, algorithm refinement, or contribution to experiments and writing."
    entries:
      - title: "Sparse Traffic Accident Risk Forecasting With Spatial-Temporal Knowledge Graphs"
        authors: Shengnan Guo, Yan Lin, Wei Chen, Weiwen Tang, Haochen Lv, Rongzhi Zhou, Junliang Lin, Youfang Lin, Huaiyu Wan
        desc: "Helps cities identify where traffic accidents are most likely, even when past accident records are sparse. It combines road, traffic, weather, and location information to forecast risk at both street and neighborhood levels, supporting earlier warnings and safer travel."
        tags:
          - "IEEE TKDE"
          - "2026"
        links:
          Paper: "https://ieeexplore.ieee.org/document/11589565"
          Code: "https://github.com/guoshnBJTU/STKGRisk"

      - title: "Low-Rank Prior-Induced Consistency Flow Matching for Efficient Traffic Imputation"
        authors: Xiaowei Mao, Tingrui Wu, YangYawen, Shengnan Guo, Yan Lin, Shilong Zhao, Haochen Lv, Youfang Lin, Huaiyu Wan
        desc: ""
        tags:
          - "KDD"
          - "2026"
        links: {}

      - title: "G-VTM: A Multimodal Vision-Trajectory Model for Generalized Vehicle Trajectory Prediction"
        authors: Xinyue Zhang, Letian Gong, Yan Lin, Jinjun Cheng, Junlin Zhang, Guanyu Yao, Shengnan Guo, Youfang Lin, Shaojiang Wang, Huaiyu Wan
        desc: ""
        tags:
          - "IJCAI"
          - "2026"
        links: {}

      - title: "ForceTraj: Modeling Realistic Intention and Heterogeneous Interactions for Multi-modal Trajectory Prediction"
        authors: Guanyu Yao, Yan Lin, Letian Gong, Xinyue Zhang, Yiwei Shuang, Shengnan Guo, Huaiyu Wan
        desc: "Predicts the future paths of vehicles for autonomous driving by inferring driver intentions such as lane changes and by modeling how nearby vehicles influence each other. It produces several likely future trajectories rather than a single guess, which improves prediction accuracy on real driving datasets."
        tags:
          - "DASFAA"
          - "2026"
        links:
          Paper: https://link.springer.com/chapter/10.1007/978-981-92-0375-8_24

      - title: "Traj-MLLM: Can Multimodal Large Language Models Reform Trajectory Data Mining?"
        authors: Shuo Liu, Di Yao, Yan Lin, Gao Cong, Jingping Bi
        desc: "Lets multimodal large language models analyze movement trajectories across different regions and tasks without any training, by turning raw trajectories into combined image and text inputs that keep their spatial and temporal structure. A single setup then handles many trajectory analysis tasks."
        tags:
          - "KDD"
          - "2026"
        links:
          Preprint: "https://arxiv.org/abs/2509.00053"

      - id: sculptdrug
        title: "SculptDrug: A Spatial Condition-Aware Bayesian Flow Model for Structure-based Drug Design"
        authors: Qingsong Zhong, Haomin Yu, Yan Lin, Wangmeng Shen, Long Zeng, Jilin Hu
        desc: "Generates drug molecules that fit a target protein's three-dimensional structure, keeping the molecules shaped to sit within the protein's surface and consistent with both its overall form and fine details. This produces more accurate candidate molecules for structure-based drug discovery."
        tags:
          - "AAAI"
          - "2026"
        links:
          Paper: "https://ojs.aaai.org/index.php/AAAI/article/view/37139"
          Preprint: "https://arxiv.org/abs/2511.12489"

      - title: "Spatial-Temporal Feedback Diffusion Guidance for Controlled Traffic Imputation"
        authors: Xiaowei Mao, Huihu Ding, Yan Lin, Tingrui Wu, Shengnan Guo, Dazhuo Qiu, Feiling Fang, Jilin Hu, Huaiyu Wan
        desc: "Fills in missing values in traffic data by guiding the generation process to stay close to the available observations, adjusting how strongly it follows them for each location and time so that places with few observations are reconstructed more accurately."
        tags:
          - "AAAI"
          - "2026"
        links:
          Paper: "https://ojs.aaai.org/index.php/AAAI/article/view/38581"
          Preprint: "https://arxiv.org/abs/2601.04572"

      - title: "DUET: Dual Clustering Enhanced Multivariate Time Series Forecasting"
        authors: "Xiangfei Qiu, Xingjian Wu, Yan Lin, Chenjuan Guo, Jilin Hu, Bin Yang"
        desc: "Improves forecasting of multivariate time series by adapting to how patterns change over time and by modeling the relationships between the different variables while reducing the influence of noisy ones."
        tags:
          - "KDD"
          - "2025"
        links:
          Paper: "https://dl.acm.org/doi/10.1145/3690624.3709325"
          Preprint: "https://arxiv.org/abs/2412.10859"
          Code: "https://github.com/decisionintelligence/DUET"

      - title: "Diff-RNTraj: A Structure-aware Diffusion Model for Road Network-constrained Trajectory Generation"
        authors: "Tonglong Wei, Youfang Lin, Shengnan Guo, Yan Lin, Yiheng Huang, Chenyang Xiang, Yuqing Bai, Menglu Ya, Huaiyu Wan"
        desc: "Generates synthetic vehicle trajectories that stay on real road networks and carry road-level information, helping address the shortage of public trajectory data caused by privacy concerns. Each generated point is tied to a road segment and a moving rate, so the trajectories are realistic and ready for downstream trajectory mining tasks."
        tags:
          - "IEEE TKDE"
          - "2024"
        links:
          Paper: "https://www.computer.org/csdl/journal/tk/5555/01/10679607/20b3hlbjBOo"
          Preprint: "https://arxiv.org/abs/2402.07369"
          Code: "https://github.com/wtl52656/Diff-RNTraj"

      - title: "STCDM: Spatio-Temporal Contrastive Diffusion Model for Check-In Sequence Generation"
        authors: "Letian Gong, Shengnan Guo, Yan Lin, Yichen Liu, Erwen Zheng, Yiwei Shuang, Youfang Lin, Jilin Hu, Huaiyu Wan"
        desc: "Generates realistic synthetic check-in sequences that capture how people move and visit places over time and space, so that researchers can study and build on this kind of data without relying on scarce real records that are limited by privacy concerns."
        tags:
          - "IEEE TKDE"
          - "2024"
        links:
          Paper: "https://ieeexplore.ieee.org/document/10836764"

      - title: "Micro-Macro Spatial-Temporal Graph-based Encoder-Decoder for Map-Constrained Trajectory Recovery"
        authors: "Tonglong Wei, Youfang Lin, Yan Lin, Shengnan Guo, Lan Zhang, Huaiyu Wan"
        desc: "Reconstructs the missing points in sparse GPS trajectories so the recovered paths stay on the road network. It combines the fine details of each individual trip with broader travel patterns shared across many trips to fill in the gaps more accurately."
        tags:
          - "IEEE TKDE"
          - "2024"
        links:
          Paper: "https://www.computer.org/csdl/journal/tk/5555/01/10517676/1WCj0j0FljW"
          Preprint: "https://arxiv.org/abs/2404.19141"
          Code: "https://github.com/wtl52656/MM-STGED"

      - title: "Inductive and Adaptive Graph Convolution Networks Equipped with Constraint Task for Spatial-Temporal Traffic Data Kriging"
        authors: "Tonglong Wei, Youfang Lin, Shengnan Guo, Yan Lin, Yiji Zhao, Xiyuan Jin, Zhihao Wu, Huaiyu Wan"
        desc: "Estimates traffic conditions at locations that have no sensor by learning from the sensors that are available, and handles newly added locations without needing to retrain the model."
        tags:
          - "KBS"
          - "2024"
        links:
          Paper: "https://www.sciencedirect.com/science/article/pii/S0950705123010730"
          Code: "https://github.com/wtl52656/IAGCN"

      - title: "Spatial-Temporal Cross-View Contrastive Pre-Training for Check-in Sequence Representation Learning"
        authors: "Letian Gong, Huaiyu Wan, Shengnan Guo, Li Xiucheng, Yan Lin, Erwen Zheng, Tianyi Wang, Zeyu Zhou, Youfang Lin"
        desc: "Learns general-purpose representations of user check-in sequences from location-based services by jointly capturing where users go and when they go there. The learned representations transfer across different downstream tasks that rely on understanding user mobility."
        tags:
          - "IEEE TKDE"
          - "2024"
        links:
          Paper: "https://ieeexplore.ieee.org/document/10613424"
          Preprint: "https://arxiv.org/abs/2407.15899"

      - title: "Contrastive Pre-training with Adversarial Perturbations for Check-In Sequence Representation Learning"
        authors: "Letian Gong, Youfang Lin, Shengnan Guo, Yan Lin, Tianyi Wang, Erwen Zheng, Zeyu Zhou, Huaiyu Wan"
        desc: "Learns general-purpose representations of human check-in sequences that capture spatial and temporal patterns of where people go over time, so the same learned features transfer across many mobility tasks. Removes the need to hand-design how the data is varied during training, giving stronger and more reliable results than task-specific models."
        tags:
          - "AAAI"
          - "2023"
        links:
          Paper: "https://ojs.aaai.org/index.php/AAAI/article/view/25546"
          Code: "https://github.com/LetianGong/CACSR"

      - title: "Adversarial Self-Attentive Time-Variant Neural Networks for Multi-Step Time Series Forecasting"
        authors: "Changxia Gao, Ning Zhang, Youru Li, Yan Lin, Huaiyu Wan"
        desc: "Forecasts many future steps of a time series at once and adapts to how the patterns in the series change over time. A training scheme that judges whether predictions look realistic and follow naturally from the recent input helps keep long-range forecasts accurate."
        tags:
          - "ESWA"
          - "2023"
        links:
          Paper: "https://www.sciencedirect.com/science/article/pii/S0957417423012241"

      - title: "Multi-scale Adaptive Attention-based Time-Variant Neural Networks for Multi-step Time Series Forecasting"
        authors: "Changxia Gao, Ning Zhang, Youru Li, Yan Lin, Huaiyu Wan"
        desc: "Forecasts future values of a time series over multiple steps ahead by adapting to how temporal patterns change over time and by capturing patterns that appear at different time scales. Tested on climate and energy consumption data, it gives more accurate forecasts than earlier methods."
        tags:
          - "APIN"
          - "2023"
        links:
          Paper: "https://link.springer.com/article/10.1007/s10489-023-05057-7"

      - title: "WITRAN: Water-wave Information Transmission and Recurrent Acceleration Network for Long-range Time Series Forecasting"
        authors: "Yuxin Jia, Youfang Lin, Xinyan Hao, Yan Lin, Shengnan Guo, Huaiyu Wan"
        desc: "Forecasts time series far into the future by jointly capturing patterns at different time scales and the repeating structure across them. It does this while keeping computation efficient, so it stays fast and accurate even over very long horizons."
        tags:
          - "NeurIPS"
          - "2023"
        links:
          Paper: "https://openreview.net/forum?id=y08bkEtNBK"
          Code: "https://github.com/Water2sea/WITRAN"

projects:
  primary:
    desc: "Projects where I serve as the principal investigator or lead developer, responsible for the overall research direction, system design, and implementation."
    entries:
